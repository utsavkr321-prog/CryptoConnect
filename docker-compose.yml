services:
  backend:
    build: ./backend
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in protected runtime configuration}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-cryptoconnect}
      JWT_SECRET: ${JWT_SECRET:?Set a strong non-placeholder JWT_SECRET before starting the backend}
      CORS_ORIGIN: http://localhost:5173
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
