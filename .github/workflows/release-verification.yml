name: Release verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: MongoDB, Compose, API and browser gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies and verify API build guards
        shell: bash
        run: |
          set -euo pipefail
          for candidate in .env .env.local .env.production .env.production.local backend/.env; do
            if [ -e "$candidate" ]; then
              echo "Refusing CI run because a local environment file is present: $candidate" >&2
              exit 1
            fi
          done
          npm ci
          if VITE_APP_MODE=api npm run build > "$RUNNER_TEMP/missing-api-url.log" 2>&1; then
            echo 'API build unexpectedly accepted a missing VITE_API_URL.' >&2
            exit 1
          fi
          grep -q 'VITE_API_URL must be set' "$RUNNER_TEMP/missing-api-url.log"
          if VITE_APP_MODE=api VITE_API_URL=https://bad.invalid npm run build > "$RUNNER_TEMP/invalid-api-url.log" 2>&1; then
            echo 'API build unexpectedly accepted an .invalid API URL.' >&2
            exit 1
          fi
          grep -q 'routable HTTPS origin' "$RUNNER_TEMP/invalid-api-url.log"
          VITE_APP_MODE=api VITE_API_URL=https://api.ci.example.test npm run build

      - name: Start isolated MongoDB for Compose and restore checks
        shell: bash
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="$RUNNER_TEMP/cryptoconnect-${run_id}"
          mongo_name="cc-mongo-${run_id}"
          edge_name="cc-edge-${run_id}"
          mkdir -m 700 -p "$run_dir"
          printf 'CC_RUN_DIR=%s\nCC_MONGO_CONTAINER=%s\nCC_PROJECT=cc-ci-%s\nCC_EDGE=cc-edge-%s\n' \
            "$run_dir" "$mongo_name" "$run_id" "$run_id" >> "$GITHUB_ENV"
          openssl rand -hex 32 > "$run_dir/jwt-secret"
          chmod 0444 "$run_dir/jwt-secret"
          docker network create "$edge_name" >/dev/null
          docker run -d --name "$mongo_name" --network "$edge_name" --network-alias cc-mongo mongo:7.0
          for attempt in $(seq 1 60); do
            if docker exec "$mongo_name" mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 60 ]; then echo 'Disposable MongoDB 7 did not become ready.' >&2; exit 1; fi
            sleep 2
          done
          docker exec "$mongo_name" mongosh --quiet --eval 'db.version()' | grep -E '^7\.'

      - name: Run backend suite and MongoDB Testcontainers integration tests
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && mvn -B -ntp clean package)
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('backend/target/surefire-reports/TEST-*.xml')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          integration = 0
          for path in files:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, 0))
                  if 'MongoPersistenceIntegrationTest' in suite.attrib.get('name', ''):
                      integration += int(suite.attrib.get('tests', 0)) - int(suite.attrib.get('skipped', 0))
          passed = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
          print(f"Backend: {totals['tests']} tests, {passed} passed, {totals['failures']} failed, {totals['errors']} errors, {totals['skipped']} skipped; MongoDB integration executed={integration}")
          if not files or totals['failures'] or totals['errors'] or totals['skipped'] or integration < 2:
              sys.exit(1)
          PY

      - name: Validate and build the actual staging Compose model
        shell: bash
        run: |
          set -euo pipefail
          backend_id=""
          print_backend_diagnostics() {
            echo 'Backend container status:'
            if [ -n "$backend_id" ]; then
              docker inspect -f 'state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$backend_id" 2>&1 || true
              echo 'Backend required configuration (values withheld):'
              docker exec "$backend_id" sh -ec '
          for name in MONGODB_URI MONGODB_DATABASE CORS_ORIGIN; do
            if printenv "$name" >/dev/null 2>&1; then printf "%s=set\n" "$name"; else printf "%s=missing\n" "$name"; fi
          done
          if test -r /run/secrets/staging_jwt_secret; then echo JWT_SECRET_FILE=readable; else echo JWT_SECRET_FILE=unreadable; fi
          ' 2>&1 || true
              echo 'Backend readiness endpoint (status only):'
              docker exec "$backend_id" wget -q -O - http://127.0.0.1:8080/health/ready 2>&1 || echo 'Readiness endpoint unavailable.'
            fi
            docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" ps -a backend 2>&1 || true
            echo 'Backend container logs (last 200 lines; sensitive values redacted):'
            if ! docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" logs --no-color --tail=200 backend 2>&1 |
              python3 -c '
          import re, sys
          for line in sys.stdin:
              line = re.sub(r"(?i)(mongodb(?:\+srv)?://)[^/@\s]+:[^/@\s]+@", r"\1[REDACTED]@", line)
              line = re.sub(r"(?i)([\"\x27]?[\w.-]*(?:password|secret|token|authorization|mongodb_uri|connection_string)[\w.-]*[\"\x27]?\s*[:=]\s*[\"\x27]?)([^\"\x27\s,;}{]+)([\"\x27]?)", r"\1[REDACTED]\3", line)
              sys.stdout.write(line)
          '; then
              echo 'Unable to retrieve backend container logs.' >&2
            fi
          }
          report_backend_gate_error() {
            local exit_code=$?
            trap - ERR
            printf 'Backend Compose gate command failed (exit %s): %s\n' "$exit_code" "$BASH_COMMAND" >&2
            print_backend_diagnostics
            exit "$exit_code"
          }
          trap report_backend_gate_error ERR
          cat > "$CC_RUN_DIR/compose.env" <<EOF
          STAGING_BACKEND_IMAGE=cryptoconnect-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          STAGING_CORS_ORIGIN=http://127.0.0.1:5173
          STAGING_PROXY_NETWORK=$CC_EDGE
          STAGING_MONGODB_URI=mongodb://cc-mongo:27017/cryptoconnect_staging?directConnection=true
          STAGING_MONGODB_DATABASE=cryptoconnect_staging
          STAGING_JWT_SECRET_FILE=$CC_RUN_DIR/jwt-secret
          EOF
          chmod 0600 "$CC_RUN_DIR/compose.env"
          docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" config --quiet
          test "$(docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" config --services)" = backend
          docker compose --progress plain --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" build backend
          docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" up -d
          startup_started=$SECONDS
          for attempt in $(seq 1 90); do
            backend_id=$(docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" ps -q backend)
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$backend_id" 2>/dev/null || true)
            if [ "$health" = healthy ]; then
              echo "Compose backend became healthy after $((SECONDS - startup_started)) seconds."
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "Compose backend did not become healthy after 90 checks ($((SECONDS - startup_started)) seconds); last health state: $health." >&2
              print_backend_diagnostics
              trap - ERR
              exit 1
            fi
            sleep 2
          done
          echo 'Checking backend runtime user.'
          test "$(docker inspect -f '{{.Config.User}}' "$backend_id")" = '10001:10001'
          echo 'Checking backend has no host-published ports.'
          test -z "$(docker inspect -f '{{json .NetworkSettings.Ports}}' "$backend_id" | grep -v 'null' || true)"
          echo 'Checking backend can read its mounted JWT secret.'
          docker exec --user 10001:10001 "$backend_id" sh -ec 'test -r /run/secrets/staging_jwt_secret'
          echo 'Checking MongoDB has no host-published ports.'
          test -z "$(docker inspect -f '{{json .NetworkSettings.Ports}}' "$CC_MONGO_CONTAINER" | grep -v 'null' || true)"
          echo 'Checking backend and MongoDB each use only the private edge network.'
          test "$(docker inspect -f '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$backend_id" | wc -l)" -eq 1
          test "$(docker inspect -f '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$CC_MONGO_CONTAINER" | wc -l)" -eq 1
          echo 'Checking backend and MongoDB are attached to the expected private edge network.'
          docker inspect -f '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$backend_id" | grep -Fx "$CC_EDGE"
          docker inspect -f '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$CC_MONGO_CONTAINER" | grep -Fx "$CC_EDGE"

      - name: Run two-profile browser acceptance against the Compose stack
        shell: bash
        run: |
          set -euo pipefail
          cat > "$CC_RUN_DIR/nginx.conf" <<'EOF'
          server {
            listen 8080;
            location / {
              proxy_pass http://backend:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header Origin $http_origin;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $http_connection;
              proxy_read_timeout 3600s;
            }
          }
          EOF
          docker run -d --name "$CC_PROJECT-proxy" --network "$CC_EDGE" \
            --publish 127.0.0.1:18080:8080 \
            --mount "type=bind,src=$CC_RUN_DIR/nginx.conf,dst=/etc/nginx/conf.d/default.conf,readonly" nginx:alpine >/dev/null
          test "$(docker inspect -f '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$CC_PROJECT-proxy" | wc -l)" -eq 1
          docker inspect -f '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$CC_PROJECT-proxy" | grep -Fx "$CC_EDGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo 'Loopback-only CI proxy did not reach backend readiness.' >&2; exit 1; fi
            sleep 2
          done
          mkdir -m 700 "$CC_RUN_DIR/playwright"
          (cd "$CC_RUN_DIR/playwright" && npm init -y >/dev/null && npm install --save-exact @playwright/test@1.64.1)
          "$CC_RUN_DIR/playwright/node_modules/.bin/playwright" install --with-deps chromium
          printf 'PLAYWRIGHT_MODULE=%s\n' "$CC_RUN_DIR/playwright/node_modules/@playwright/test" >> "$GITHUB_ENV"
          printf 'ACCEPTANCE_STATE_PATH=%s/browser-state.json\n' "$CC_RUN_DIR" >> "$GITHUB_ENV"
          printf 'COMPOSE_ENV_FILE=%s/compose.env\n' "$CC_RUN_DIR" >> "$GITHUB_ENV"
          printf 'CC_COMPOSE_PROJECT=%s\n' "$CC_PROJECT" >> "$GITHUB_ENV"
          printf 'CC_COMPOSE_FILE=%s/docker-compose.staging.yml\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          VITE_APP_MODE=api VITE_API_URL=http://127.0.0.1:18080 npm run dev -- --host 127.0.0.1 --port 5173 > "$CC_RUN_DIR/vite.log" 2>&1 &
          echo $! > "$CC_RUN_DIR/vite.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/login >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo 'Vite acceptance server did not become ready.' >&2; exit 1; fi
            sleep 2
          done
          PLAYWRIGHT_MODULE="$CC_RUN_DIR/playwright/node_modules/@playwright/test" \
            ACCEPTANCE_STATE_PATH="$CC_RUN_DIR/browser-state.json" \
            COMPOSE_ENV_FILE="$CC_RUN_DIR/compose.env" CC_COMPOSE_PROJECT="$CC_PROJECT" \
            CC_COMPOSE_FILE=docker-compose.staging.yml \
            "$CC_RUN_DIR/playwright/node_modules/.bin/playwright" test tests/e2e/release-acceptance.spec.cjs --workers=1 --reporter=line

      - name: Verify MongoDB backup restore by running the app against the restored database
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" stop -t 40 backend
          docker exec "$CC_MONGO_CONTAINER" mongodump --db cryptoconnect_staging --archive=/tmp/cc-staging.archive
          docker cp "$CC_MONGO_CONTAINER:/tmp/cc-staging.archive" "$CC_RUN_DIR/staging.archive"
          test -s "$CC_RUN_DIR/staging.archive"
          docker exec "$CC_MONGO_CONTAINER" mongorestore --archive=/tmp/cc-staging.archive --nsFrom='cryptoconnect_staging.*' --nsTo='cryptoconnect_restore.*'
          cat > "$CC_RUN_DIR/restore.override.yml" <<'EOF'
          services:
            backend:
              environment:
                MONGODB_URI: mongodb://cc-mongo:27017/cryptoconnect_restore?directConnection=true
                MONGODB_DATABASE: cryptoconnect_restore
          EOF
          docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -f "$CC_RUN_DIR/restore.override.yml" -p "$CC_PROJECT" up -d --no-deps backend
          for attempt in $(seq 1 90); do
            backend_id=$(docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -f "$CC_RUN_DIR/restore.override.yml" -p "$CC_PROJECT" ps -q backend)
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$backend_id" 2>/dev/null || true)
            if [ "$health" = healthy ]; then break; fi
            if [ "$attempt" -eq 90 ]; then echo 'Backend did not become healthy against restored database.' >&2; exit 1; fi
            sleep 2
          done
          CC_RESTORED_API_URL=http://127.0.0.1:18080 \
            node scripts/verify-restored-database.mjs "$CC_RUN_DIR/browser-state.json"
          docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" stop -t 40 backend

      - name: Clean up only this run's disposable resources
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${CC_RUN_DIR:-}" ] && [ -d "$CC_RUN_DIR" ]; then
            if [ -f "$CC_RUN_DIR/vite.pid" ]; then kill "$(cat "$CC_RUN_DIR/vite.pid")" 2>/dev/null; fi
          fi
          if [ -n "${CC_PROJECT:-}" ] && [ -n "${CC_RUN_DIR:-}" ] && [ -f "$CC_RUN_DIR/compose.env" ]; then
            docker compose --env-file "$CC_RUN_DIR/compose.env" -f docker-compose.staging.yml -p "$CC_PROJECT" down -v --remove-orphans
            docker rm -f "$CC_PROJECT-proxy" >/dev/null 2>&1
          fi
          if [ -n "${CC_MONGO_CONTAINER:-}" ]; then docker rm -fv "$CC_MONGO_CONTAINER" >/dev/null 2>&1; fi
          if [ -n "${CC_EDGE:-}" ]; then docker network rm "$CC_EDGE" >/dev/null 2>&1; fi
          if [ -n "${CC_RUN_DIR:-}" ] && [[ "$CC_RUN_DIR" == "$RUNNER_TEMP"/cryptoconnect-* ]]; then rm -rf -- "$CC_RUN_DIR"; fi
